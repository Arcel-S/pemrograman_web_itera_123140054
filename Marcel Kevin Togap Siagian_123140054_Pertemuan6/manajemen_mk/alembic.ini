# FILE: alembic.ini
[alembic]
# Menunjuk ke folder script yang ada di dalam paket manajemen_mk
script_location = manajemen_mk/alembic
sqlalchemy.url = postgresql://postgres:password@localhost:5432/db_mahasiswa_123140054

# Konfigurasi Logging (Standar)
[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s:%(lineno)s][%(threadName)s] %(message)s