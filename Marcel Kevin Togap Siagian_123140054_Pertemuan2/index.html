<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dashboard Mahasiswa</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <form id="login-form" class="card">
            <h2>Login Dashboard</h2>
            <p>Masukkan NIM dan password Anda.</p>
            
            <div class="form-group">
                <label for="username">NIM (Username)</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn">Login</button>
            <button type="button" id="register-btn" class="btn btn-secondary">Register</button>
            
            <p id="error-message" class="error"></p>
        </form>
    </div>

    <script type="module" src="./modules/login.js"></script>
</body>
</html>
